services:
  grain-stitch:
    build: .
    image: grain-stitch:latest
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    ports:
      # 宿主机端口可用环境变量 API_HOST_PORT 配置，默认 8080
      - "${API_HOST_PORT:-8080}:8000"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import json,os,urllib.request;port=os.environ.get('APP_PORT','8000');r=urllib.request.urlopen('http://127.0.0.1:%s/health'%port,timeout=2);assert json.load(r)['status']=='healthy'"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped
